
# ============================================================
# NETWORK
# ============================================================

networks:
  net:
    name: bigdata-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

# ============================================================
# SERVICES
# ============================================================

services:

  # ==========================================================
  # HADOOP NAMENODE
  # ==========================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./hadoop-conf:/opt/hadoop-conf:ro
    environment:
      CLUSTER_NAME: test
      HADOOP_CONF_DIR: /opt/hadoop-conf
      CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: "false"
    env_file:
      - ./hadoop.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - net

  # ==========================================================
  # HADOOP DATANODE
  # ==========================================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: always
    depends_on:
      namenode:
        condition: service_started
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - ./hadoop-conf:/opt/hadoop-conf:ro
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      HADOOP_CONF_DIR: /opt/hadoop-conf
      CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
    env_file:
      - ./hadoop.env
    networks:
      - net

  # ==========================================================
  # HADOOP RESOURCE MANAGER (YARN)
  # ==========================================================
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    hostname: resourcemanager
    restart: always
    depends_on:
      - namenode
      - datanode
    ports:
      - "8088:8088"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./hadoop.env
    networks:
      - net

  # ==========================================================
  # HADOOP NODE MANAGER (YARN)
  # ==========================================================
  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    restart: always
    depends_on:
      - resourcemanager
    ports:
      - "8042:8042"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env
    networks:
      - net

  # ==========================================================
  # HADOOP HISTORY SERVER
  # ==========================================================
  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    hostname: historyserver
    restart: always
    depends_on:
      - resourcemanager
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env
    networks:
      - net

  # ==========================================================
  # POSTGRESQL - APPLICATION DATABASE (RDBMS / temp_db)
  # ==========================================================
  database:
    image: postgres:14
    container_name: postgres-db
    hostname: database
    restart: always
    environment:
      POSTGRES_DB: temp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passw0rd
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data_to_import:/var/lib/postgresql/data/lmwn
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - net

  # ==========================================================
  # POSTGRESQL - HIVE METASTORE BACKEND
  # ==========================================================
  hive-metastore-postgresql:
    image: postgres:14
    container_name: hive-metastore-postgresql
    hostname: hive-metastore-postgresql
    restart: always
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - net

  # ==========================================================
  # HIVE 4 - METASTORE SERVICE (AVEC SUPPORT ICEBERG)
  # ==========================================================
  hive-metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    hostname: hive-metastore
    restart: always
    depends_on:
      hive-metastore-postgresql:
        condition: service_healthy
      namenode:
        condition: service_started
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-postgresql:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive_password
        -Dhive.execution.engine=mr
        -Diceberg.engine.hive.enabled=true
    ports:
      - "9083:9083"
    volumes:
      - ./hive-conf:/hive_custom_conf:ro
      - ./hadoop-conf:/opt/hadoop-conf:ro
      - ./postgres-jdbc.jar:/opt/hive/lib/postgres.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - net

  # ==========================================================
  # HIVE 4 - HIVESERVER2 & ICEBERG RUNTIME
  # ==========================================================
  hive-server:
    image: apache/hive:4.0.1
    container_name: hive-server
    hostname: hive-server
    restart: always
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-postgresql:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive_password
        -Dhive.execution.engine=mr
        -Diceberg.engine.hive.enabled=true
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive-conf:/hive_custom_conf:ro
      - ./hadoop-conf:/opt/hadoop-conf:ro
      - ./postgres-jdbc.jar:/opt/hive/lib/postgres.jar:ro
      - ./others/sqoop:/opt/sqoop
      - ./data_to_import:/opt/data_to_import
    networks:
      - net

# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:
  hadoop_namenode:
    name: hadoop_namenode
  hadoop_datanode:
    name: hadoop_datanode
  hadoop_historyserver:
    name: hadoop_historyserver
  hive_metastore_data:
    name: hive_metastore_data
  pgdata:
    name: postgres_app_data
